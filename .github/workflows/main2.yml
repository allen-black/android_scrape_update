# Hourly scraping
name: android_scraping

# Controls when the action will run.

on:
  schedule:
    - cron:  '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest # or windows-latest, macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Use the checkout action to access your code

      - name: Set up R 
        uses: r-lib/actions/setup-r@v2


      - name: Install dependencies (optional, but recommended)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          use-public-rspm: true # Uses Posit Public Package Manager for speed

    
    # Set-up R
      - name: Install packages
        run: |
           R -e 'install.packages("rvest")'
           R -e 'install.packages("RCurl")'
           R -e 'install.packages("stringi")'
           R -e 'install.packages("tibble")'
    # Run R script
      - name: Scrape
        run: Rscript google_play_file.R
      
 # Add new files in data folder, commit along with other modified files, push
      - name: Commit files
        run: |
         git config --local user.name actions-user
         git config --local user.email "actions@github.com"
         git add *
         git commit -am "GH ACTION Headlines $(date)"
         git push origin Initial
        env:
         REPO_KEY: ${{secrets.GITHUB_TOKEN}}
         username: github-actions
