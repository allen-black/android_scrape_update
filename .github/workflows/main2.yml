# Hourly scraping
name: android_scraping

# Controls when the action will run.

on:
  schedule:
    - cron:  '0 10 * * *'
 
jobs: 
  autoscrape:
    # The type of runner that the job will run on
    runs-on: macos-latest

    # Load repo and install R
    steps:
    - uses: actions/checkout@main
    - uses: r-lib/actions/setup-r@v2
    
    # Set-up R
    
    - name: Install packages
      run: |
       R -e 'options(pkgType = "both"); install.packages(c("rvest", "RCurl", "stringi", "tibble", "xml2", "openssl", "vctrs", "cli", "rlang", "selectr"))'

    - name: Update R repositories
      run: R -e 'options(repos = c(CRAN = "https://cran.rstudio.com")); print(getOption("repos"))'


    # Run R script
    - name: Scrape
      run: Rscript google_play_file.R
      
 # Add new files in data folder, commit along with other modified files, push
    - name: Commit files
      run: |
        git config --local user.name actions-user
        git config --local user.email "actions@github.com"
        git add *
        git commit -am "GH ACTION Headlines $(date)"
        git push origin Initial
      env:
        REPO_KEY: ${{secrets.GITHUB_TOKEN}}
        username: github-actions
